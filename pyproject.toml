[project]
name = "opencv-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Rehatbir Singh",email = "rehatbir.singh@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python (>=4.13.0.90,<5.0.0.0)",
    "numpy (>=2.4.1,<3.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "discord.py (>=2.3.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "opencv_project", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.14,<0.15.0)"
]
